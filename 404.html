<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Azwidali Manyaga</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;color-scheme:dark}
    body{font-family:'Inter',system-ui,sans-serif;background:#080808;color:#f0ecf9;min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
    .wrap{max-width:480px}
    .code{font-size:clamp(4rem,10vw,8rem);font-weight:800;background:linear-gradient(135deg,#ff2800,#9f1600);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
    h1{font-size:1.5rem;margin:1rem 0 .5rem;font-weight:700}
    p{color:rgba(255,255,255,.58);margin-bottom:2rem;line-height:1.6}
    a{display:inline-block;padding:.75rem 2rem;background:linear-gradient(135deg,#ff2800,#9f1600);color:#fff;border-radius:12px;text-decoration:none;font-weight:600;transition:opacity .2s}
    a:hover{opacity:.88}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="index.html">Back to Home</a>
  </div>
</body>
</html>
